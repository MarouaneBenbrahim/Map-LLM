services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sumoxpypsa-backend
    working_dir: /app
    environment:
      USING_LIBSUMO: "true"
      FLASK_APP: main_complete_integration.py
      FLASK_HOST: "0.0.0.0"
      PORT: "5000"
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: ignore::SyntaxWarning
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    mem_limit: 16g
    deploy:
      resources:
        limits:
          memory: 16G
    command: ["python", "main_complete_integration.py"]
